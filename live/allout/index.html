<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ALL OUT 02 | נתונים בזמן אמת</title>
<meta property="og:title" content="ALL OUT 02 | נתונים בזמן אמת">
<meta property="og:description" content="דשבורד לייב: כניסות, הצטרפות לוואטסאפ ומעבר לקניית כרטיס — TripleBoost">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f4f6fb; --surface: #ffffff; --fg: #111a33; --muted: #5b6480; --line: #e0e5f0;
  --accent: #7a2cff; --accent-2: #ff3d9a; --accent-soft: #f1e9ff;
  --good: #14804f; --good-soft: #e3f4ec; --warn: #b26a00; --warn-soft: #fbf0dc; --bar: #c9d1e6;
  --f-display: "Rubik", "Arial Hebrew", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Hebrew", "Arial Hebrew", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }
h1, h2 { font-family: var(--f-display); margin: 0; line-height: 1.25; text-wrap: balance; }
h1 { font-size: clamp(24px, 4vw, 34px); font-weight: 700; }
h2 { font-size: 20px; font-weight: 600; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
main { display: flex; flex-direction: column; gap: 30px; }
main[hidden] { display: none; }
section { display: flex; flex-direction: column; gap: 14px; }

/* Header */
.top { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.top-band { height: 6px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
.top-in { padding: 22px 26px 24px; display: flex; flex-direction: column; gap: 16px; }
.brand { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand .tb { height: 30px; width: auto; }
.brand .client { height: 34px; width: auto; }
.title-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.chip { font-size: 13px; font-weight: 500; padding: 3px 12px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.chip.on { background: var(--good-soft); color: var(--good); }
.chip.off { background: var(--warn-soft); color: var(--warn); }
.live { display: inline-flex; align-items: center; gap: 7px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(20,128,79,.5); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(20,128,79,0); } 100% { box-shadow: 0 0 0 0 rgba(20,128,79,0); } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

/* Range tabs */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button {
  font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
  padding: 7px 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.tabs button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

/* A/B switch */
.ab { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.ab button {
  font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 10px 14px; background: transparent; color: var(--fg);
  display: flex; flex-direction: column; align-items: center; gap: 0; line-height: 1.35; min-width: 0;
}
.ab button b { font-family: var(--f-display); font-size: 16px; font-weight: 600; }
.ab button small { font-size: 12.5px; color: var(--muted); }
.ab button b i { font-style: normal; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; margin-inline-end: 7px; font-size: 13px; background: var(--accent-soft); color: var(--accent); vertical-align: 1px; }
.ab button[aria-selected="true"] b i { background: rgba(255,255,255,.22); color: #fff; }
.ab button[aria-selected="true"] { background: linear-gradient(135deg, var(--accent), #b02cff 60%, var(--accent-2)); color: #fff; }
.ab button[aria-selected="true"] small { color: rgba(255,255,255,.85); }
.ab button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .l { font-size: 13px; color: var(--muted); }
.kpi .v { font-family: var(--f-display); font-size: 28px; font-weight: 700; }
.kpi.hero { background: linear-gradient(135deg, var(--accent), #b02cff 60%, var(--accent-2)); border-color: transparent; color: #fff; }
.kpi.hero .l { color: rgba(255,255,255,.85); }
.kpis.small { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.kpis.small .kpi { padding: 12px 14px; }
.kpis.small .v { font-size: 20px; font-weight: 600; }

/* Funnel */
.funnel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
.fstep { display: grid; grid-template-columns: 130px minmax(0, 1fr) 120px; gap: 12px; align-items: center; font-size: 14px; }
.fstep .track { height: 26px; border-radius: 6px; background: var(--bg); overflow: hidden; }
.fstep .fill { height: 100%; border-radius: 6px; background: linear-gradient(270deg, var(--accent-2), var(--accent)); min-width: 3px; }
.fstep .val { font-weight: 600; text-align: end; }
.fstep .val small { color: var(--muted); font-weight: 400; margin-inline-start: 6px; }

/* Daily chart */
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 12px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .legend { display: flex; gap: 18px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.chart .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-inline-end: 6px; }
.empty { color: var(--muted); font-size: 14px; padding: 18px 0; text-align: center; }

/* Tables */
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 10px 14px; text-align: start; white-space: nowrap; }
thead th { font-size: 12.5px; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); }
tbody td { border-bottom: 1px solid var(--line); }
tbody tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: end; font-variant-numeric: tabular-nums; }
td.n span { direction: ltr; unicode-bidi: isolate; }
.name { font-weight: 500; white-space: normal; min-width: 180px; }
tr.total td { font-weight: 600; background: var(--accent-soft); }
.best { color: var(--good); font-weight: 600; }

/* Breakdowns */
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { font-family: var(--f-display); font-size: 16px; font-weight: 600; margin: 0; }
.brow { display: grid; grid-template-columns: 90px minmax(0, 1fr) 110px; gap: 10px; align-items: center; font-size: 13.5px; }
.brow .track { height: 18px; background: var(--bg); border-radius: 5px; overflow: hidden; }
.brow .fill { height: 100%; background: var(--bar); border-radius: 5px; }
.brow.top .fill { background: linear-gradient(270deg, var(--accent-2), var(--accent)); }
.brow .val { text-align: end; color: var(--muted); }
.brow .val b { color: var(--fg); font-weight: 600; }

.state { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 30px; text-align: center; color: var(--muted); }
.loading .kpi .v, .loading .val { color: transparent; background: linear-gradient(90deg, #eef1f7, #f7f8fb, #eef1f7); border-radius: 6px; }
footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }

@media (max-width: 900px) { .kpis.small { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split { grid-template-columns: minmax(0, 1fr); }
  .fstep { grid-template-columns: 96px minmax(0, 1fr) 104px; font-size: 13px; }
  .top-in { padding: 18px; }
}
@media (max-width: 460px) {
  .kpis.small { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi .v { font-size: 23px; }
  .brand .tb { height: 24px; } .brand .client { height: 26px; }
}
.wordmark { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .06em; direction: ltr; }
.wordmark small { font-size: 13px; letter-spacing: .02em; color: var(--muted); font-weight: 500; margin-inline-start: 8px; }
.yes { color: var(--good); font-weight: 600; }
.no { color: var(--bar); }
.note { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="ab" role="tablist" aria-label="גרסת הקמפיין">
    <button role="tab" data-v="a"><b><i>A</i>קמפיין רגיל</b><small>כרטיסים במבלים</small></button>
    <button role="tab" data-v="b"><b><i>B</i>Eventer</b><small>כרטיסים באיבנטר</small></button>
  </nav>
  <header class="top">
    <div class="top-band"></div>
    <div class="top-in">
      <div class="brand">
        <span class="wordmark">ALL OUT 02<span id="vname"></span><small>MAKE A WISH · 7.1.2027</small></span>
        <img class="tb" src="/logo.png" alt="TripleBoost">
      </div>
      <div class="title-row">
        <div>
          <h1>נתוני האתר בזמן אמת</h1>
          <div class="meta">
            <span class="live"><span class="dot"></span>לייב מהאתר</span>
            <span id="updated"></span>
          </div>
        </div>
        <div class="tabs" role="group" aria-label="טווח תאריכים">
          <button data-p="today">היום</button>
          <button data-p="yesterday">אתמול</button>
          <button data-p="last_7d">7 ימים</button>
          <button data-p="last_30d">30 ימים</button>
          <button data-p="maximum">מההתחלה</button>
        </div>
      </div>
    </div>
  </header>

  <div id="err" class="state" hidden>הנתונים לא זמינים כרגע. נסו לרענן בעוד כמה דקות.</div>
  <main id="main" class="loading">
    <section>
      <div class="kpis" id="kpis"></div>
      <div class="kpis small" id="kpis2"></div>
    </section>
    <section>
      <h2>משפך</h2>
      <div class="funnel" id="funnel"></div>
    </section>
    <section>
      <h2>יום אחר יום</h2>
      <div class="chart" id="chart"></div>
    </section>
    <section>
      <h2>מקורות תנועה</h2>
      <div class="tbl"><table id="sources"></table></div>
    </section>
    <section id="campSec">
      <h2>קמפיינים</h2>
      <div class="tbl"><table id="campaigns"></table></div>
    </section>
    <section>
      <div class="split">
        <div class="card"><h3>עומק גלילה</h3><div id="scroll"></div></div>
        <div class="card"><h3>מכשיר</h3><div id="devices"></div></div>
      </div>
    </section>
    <section>
      <h2>ביקורים אחרונים</h2>
      <div class="tbl"><table id="recent"></table></div>
    </section>
  </main>

  <footer>
    <span>הוכן על ידי TripleBoost</span>
    <span>הנתונים מתעדכנים אוטומטית כל דקה</span>
  </footer>
</div>

<script>
// A = the regular campaign (all-out-02-make-a-wish, GTM-TR9XM28V, tickets on Mevalim).
// B = the Eventer test (all-out-pulse, GTM-MJPF7D5X, tickets on Eventer). Same sections as A.
// 2026-11-10, user: purchases/revenue removed from both tabs (purchases: false).
// Each variant reads only its own eventLive slug; the data never mixes.
const VARIANTS = {
  a: { slug: "allout", name: "", purchases: false },
  b: { slug: "allout2", name: " · Eventer", purchases: false },
};
let variant = new URLSearchParams(location.search).get("v") === "b" ? "b" : "a";
const V = () => VARIANTS[variant];
const apiUrl = () => `https://bbupowzicprgtfltyepd.supabase.co/functions/v1/eventLive?s=${V().slug}`;
const REFRESH_MS = 60000;
let preset = "maximum";
try { const s = localStorage.getItem("ao-preset"); if (s) preset = s; } catch (e) {}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nf0 = new Intl.NumberFormat("he-IL", { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat("he-IL", { maximumFractionDigits: 1 });
const N = (v) => `<span class="num">${v == null ? "—" : nf0.format(v)}</span>`;
const PCT = (a, b) => `<span class="num">${b ? nf1.format((a * 100) / b) + "%" : "—"}</span>`;
const ILS = (v) => `<span class="num">₪${nf0.format(v || 0)}</span>`;
const DUR = (s) => { s = Math.round(s || 0); return s >= 60 ? `<span class="num">${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}</span> דק׳` : `<span class="num">${s}</span> שנ׳`; };
const kpi = (l, v, cls = "") => `<div class="kpi ${cls}"><span class="l">${l}</span><span class="v">${v}</span></div>`;
const DEV = { mobile: "נייד", desktop: "מחשב" };

function render(d) {
  const t = d.totals || {};
  $("updated").textContent = "עודכן " + new Date(d.updated_at).toLocaleString("he-IL", { timeZone: "Asia/Jerusalem", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });

  const P = V().purchases;
  $("kpis").innerHTML = !P ?
    kpi("עברו לקניית כרטיס", N(t.ticket), "hero") +
    kpi("הצטרפו לקבוצת הוואטסאפ", N(t.whatsapp)) +
    kpi("כניסות לאתר", N(t.sessions)) +
    kpi("מבקרים ייחודיים", N(t.visitors)) :
    kpi("רכישות", N(t.purchase), "hero") +
    kpi("הכנסות מכרטיסים", ILS(t.revenue)) +
    kpi("עברו לקניית כרטיס", N(t.ticket)) +
    kpi("הצטרפו לקבוצת הוואטסאפ", N(t.whatsapp));
  $("kpis2").innerHTML = !P ?
    kpi("אחוז מעבר לכרטיס", PCT(t.ticket, t.sessions)) +
    kpi("אחוז הצטרפות לוואטסאפ", PCT(t.whatsapp, t.sessions)) +
    kpi("זמן ממוצע באתר", DUR(t.avg_seconds)) +
    kpi("גלילה ממוצעת", `<span class="num">${nf0.format(t.avg_scroll || 0)}%</span>`) +
    kpi("כניסות מנייד", PCT(t.mobile, t.sessions)) +
    kpi("גללו עד חצי העמוד", N((d.scroll || []).find((x) => x.pct === 50)?.sessions || 0)) :
    kpi("כרטיסים שנמכרו", N(t.tickets)) +
    kpi("כניסות לאתר", N(t.sessions)) +
    kpi("מבקרים ייחודיים", N(t.visitors)) +
    kpi("אחוז מעבר לכרטיס", PCT(t.ticket, t.sessions)) +
    kpi("אחוז רכישה מהכניסות", PCT(t.purchase, t.sessions)) +
    kpi("זמן ממוצע באתר", DUR(t.avg_seconds));

  const steps = [["כניסות לאתר", t.sessions], ["גללו עד חצי", (d.scroll || []).find((s) => s.pct === 50)?.sessions || 0], ["הצטרפו לוואטסאפ", t.whatsapp], ["עברו לקניית כרטיס", t.ticket]].concat(P ? [["רכשו כרטיס", t.purchase]] : []);
  const max = Math.max(1, t.sessions || 0);
  $("funnel").innerHTML = steps.map(([l, v], i) => {
    const w = v > 0 ? Math.max(1.2, (v / max) * 100) : 0;
    return `<div class="fstep"><span>${l}</span><div class="track"><div class="fill" style="width:${w}%"></div></div>
      <span class="val">${N(v)}${i > 0 ? `<small>${PCT(v, t.sessions)}</small>` : ""}</span></div>`;
  }).join("");

  renderChart(d.days || []);

  const head = `<thead><tr><th>מקור</th><th class="n">כניסות</th><th class="n">וואטסאפ</th><th class="n">% וואטסאפ</th><th class="n">כרטיס</th><th class="n">% כרטיס</th>${P ? `<th class="n">רכישות</th>` : ""}</tr></thead>`;
  const row = (name, r) => `<tr><td class="name"><bdi>${esc(name)}</bdi></td><td class="n">${N(r.sessions)}</td><td class="n">${N(r.whatsapp)}</td><td class="n">${PCT(r.whatsapp, r.sessions)}</td><td class="n">${N(r.ticket)}</td><td class="n">${PCT(r.ticket, r.sessions)}</td>${P ? `<td class="n">${N(r.purchase)}</td>` : ""}</tr>`;
  const src = d.sources || [];
  $("sources").innerHTML = head + "<tbody>" + (src.length ? src.map((r) => row(r.source, r)).join("") +
    `<tr class="total"><td>סה״כ</td><td class="n">${N(t.sessions)}</td><td class="n">${N(t.whatsapp)}</td><td class="n">${PCT(t.whatsapp, t.sessions)}</td><td class="n">${N(t.ticket)}</td><td class="n">${PCT(t.ticket, t.sessions)}</td>${P ? `<td class="n">${N(t.purchase)}</td>` : ""}</tr>`
    : `<tr><td colspan="${P ? 7 : 6}" class="empty">אין עדיין נתונים בטווח הזה</td></tr>`) + "</tbody>";
  const camp = d.campaigns || [];
  $("campSec").hidden = !camp.length;
  $("campaigns").innerHTML = head.replace("מקור", "קמפיין") + "<tbody>" + camp.map((r) => row(r.campaign.replace(/\s*\|\s*TB\s*$/i, ""), r)).join("") + "</tbody>";

  const sc = d.scroll || [];
  $("scroll").innerHTML = sc.map((s, i) => `<div class="brow ${i === 0 ? "top" : ""}"><span>${s.pct}%</span><div class="track"><div class="fill" style="width:${t.sessions ? Math.max(1, (s.sessions / t.sessions) * 100) : 0}%"></div></div><span class="val"><b>${N(s.sessions)}</b> · ${PCT(s.sessions, t.sessions)}</span></div>`).join("") || `<p class="empty">אין עדיין נתונים</p>`;
  const dv = (d.devices || []).sort((a, b) => b.sessions - a.sessions);
  $("devices").innerHTML = dv.map((r, i) => `<div class="brow ${i === 0 ? "top" : ""}"><span>${DEV[r.device] || esc(r.device)}</span><div class="track"><div class="fill" style="width:${t.sessions ? Math.max(1, (r.sessions / t.sessions) * 100) : 0}%"></div></div><span class="val"><b>${N(r.sessions)}</b> · ${N(r.ticket)} כרטיס</span></div>`).join("") || `<p class="empty">אין עדיין נתונים</p>`;

  const rec = d.recent || [];
  const yes = (b) => b ? `<span class="yes">✓</span>` : `<span class="no">—</span>`;
  $("recent").innerHTML = `<thead><tr><th>מתי</th><th>מקור</th><th>מכשיר</th><th class="n">זמן באתר</th><th class="n">גלילה</th><th class="n">וואטסאפ</th><th class="n">כרטיס</th>${P ? `<th class="n">רכישה</th>` : ""}</tr></thead><tbody>` +
    (rec.length ? rec.map((r) => `<tr><td><span class="num">${new Date(r.at).toLocaleString("he-IL", { timeZone: "Asia/Jerusalem", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</span></td><td><bdi>${esc(r.source)}</bdi></td><td>${DEV[r.device] || esc(r.device)}</td><td class="n">${DUR(r.seconds)}</td><td class="n"><span class="num">${nf0.format(r.scroll)}%</span></td><td class="n">${yes(r.whatsapp)}</td><td class="n">${yes(r.ticket)}</td>${P ? `<td class="n">${yes(r.purchase)}</td>` : ""}</tr>`).join("")
      : `<tr><td colspan="${P ? 8 : 7}" class="empty">אין עדיין ביקורים בטווח הזה</td></tr>`) + "</tbody>";
}

function renderChart(days) {
  const el = $("chart");
  if (!days.length) { el.innerHTML = `<p class="empty">אין עדיין נתונים בטווח הזה</p>`; return; }
  const W = 1000, H = 260, pb = 28, pt = 22;
  const n = days.length, slot = W / n, bw = Math.min(38, slot * 0.62);
  const maxS = Math.max(1, ...days.map((d) => d.sessions));
  const maxC = Math.max(1, ...days.map((d) => Math.max(d.ticket, d.whatsapp, d.purchase || 0)));
  const y = (v, m) => H - pb - (v / m) * (H - pb - pt);
  const every = Math.ceil(n / 12);
  const x = (i) => W - (i + 0.5) * slot;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="כניסות, וואטסאפ וכרטיסים לפי יום">`;
  svg += `<line x1="0" x2="${W}" y1="${H - pb}" y2="${H - pb}" stroke="var(--line)"/>`;
  days.forEach((d, i) => {
    const cx = x(i), top = y(d.sessions, maxS);
    const date = d.date.slice(8, 10) + "." + d.date.slice(5, 7);
    svg += `<g><title>${date}: ${nf0.format(d.sessions)} כניסות · ${nf0.format(d.whatsapp)} וואטסאפ · ${nf0.format(d.ticket)} כרטיס${V().purchases ? ` · ${nf0.format(d.purchase || 0)} רכישות` : ""}</title>`;
    svg += `<rect x="${cx - bw / 2}" y="${top}" width="${bw}" height="${Math.max(0, H - pb - top)}" rx="4" fill="var(--bar)"/></g>`;
    if (i % every === 0) svg += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="12" fill="var(--muted)">${date}</text>`;
  });
  const line = (k, color) => {
    svg += `<polyline points="${days.map((d, i) => `${x(i)},${y(d[k], maxC)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    days.forEach((d, i) => { svg += `<circle cx="${x(i)}" cy="${y(d[k], maxC)}" r="4" fill="${color}"/>`; });
  };
  line("whatsapp", "var(--good)");
  line("ticket", "var(--accent)");
  if (V().purchases) line("purchase", "var(--accent-2)");
  svg += `</svg>`;
  el.innerHTML = `<div class="legend"><span><i style="background:var(--bar)"></i>כניסות</span><span><i style="background:var(--good)"></i>וואטסאפ</span><span><i style="background:var(--accent)"></i>מעבר לכרטיס</span>${V().purchases ? `<span><i style="background:var(--accent-2)"></i>רכישות</span>` : ""}</div>` + svg;
}

let timer, seq = 0;
async function load(showLoading) {
  const my = ++seq;
  if (showLoading) $("main").classList.add("loading");
  try {
    const r = await fetch(`${apiUrl()}&p=${preset}`, { cache: "no-store" });
    const d = await r.json();
    if (my !== seq) return;
    if (d.error) throw new Error(d.error);
    render(d);
    $("main").classList.remove("loading");
    $("main").hidden = false; $("err").hidden = true; $("main").dataset.ok = "1";
  } catch (e) {
    if (my !== seq) return;
    if (!$("main").dataset.ok) { $("main").hidden = true; $("err").hidden = false; }
  } finally {
    clearTimeout(timer);
    timer = setTimeout(() => load(false), REFRESH_MS);
  }
}
function setPreset(p) {
  preset = p;
  try { localStorage.setItem("ao-preset", p); } catch (e) {}
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.p === p)));
  load(true);
}
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => setPreset(b.dataset.p)));
function setVariant(v, push) {
  variant = v;
  document.querySelectorAll(".ab button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.v === v)));
  $("vname").textContent = V().name;
  document.title = `ALL OUT 02${V().name} | נתונים בזמן אמת`;
  if (push) {
    const u = new URL(location.href);
    if (v === "b") u.searchParams.set("v", "b"); else u.searchParams.delete("v");
    history.replaceState(null, "", u);
  }
}
document.querySelectorAll(".ab button").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.v === variant) return;
  setVariant(b.dataset.v, true);
  delete $("main").dataset.ok;
  load(true);
}));
setVariant(variant, false);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(false); });
setPreset(preset);
</script>
</body>
</html>
